#
# Build the wiki and publish it to GitHub Pages.
#
# The site is committed in its built form, so Pages can also be served straight
# from the branch. This workflow still runs `build.py --check` first, because a
# committed page that no longer matches its content fragment is the one failure
# a static site cannot show you.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The committed output matches the content
        run: python3 build.py --check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
